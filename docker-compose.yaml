services:
  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: prometheus
    user: "1000:1000"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=45d'
      - '--web.enable-lifecycle'
    # No `ports:` on purpose. This is a metrics backend: Grafana and the
    # Prometheus web UI both reach it over monitoring_net, and the Prometheus
    # self-scrape target is localhost *inside this container*.
    #
    # It used to publish 0.0.0.0:9090 with no authentication, which meant
    # anyone on the LAN could read your full host metrics — disk, filesystem
    # usage, network, what is exposed. Remove the ports and nothing breaks.
    networks:
      - monitoring_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.10.2
    container_name: node-exporter
    user: "1000:1000"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($$|/)'
    networks:
      - monitoring_net
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring_net
    restart: unless-stopped

  snmp-exporter:
    image: quay.io/prometheus/snmp-exporter:v0.27.0
    container_name: snmp-exporter
    user: "1000:1000"
    volumes:
      - ./snmp.yml:/etc/snmp_exporter/snmp.yml:ro
    # No `ports:` on purpose. Prometheus scrapes it at snmp-exporter:9116 over
    # monitoring_net; nothing else talks to it.
    networks:
      - monitoring_net
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.0
    container_name: loki
    user: "1000:1000"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - ./loki_data:/loki
    # No `ports:` on purpose. The Grafana datasource is http://loki:3100 over
    # monitoring_net and Alloy pushes to it the same way. `http_listen_port`
    # in loki-config.yml is the container's own listener and is unaffected.
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring_net
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    user: "0:0"
    volumes:
      - ./alloy-config.river:/etc/alloy/config.river:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./alloy_data:/data
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.river
    # No `ports:` on purpose. `--server.http.listen-addr` is Alloy's own
    # listener and stays; what changes is that it is no longer reachable from
    # off-host. Prometheus scrapes it at alloy:12345 over monitoring_net.
    # /metrics was readable by anyone on the LAN before.
    networks:
      - monitoring_net
    depends_on:
      - loki
    restart: unless-stopped

  # NVIDIA GPU metrics. This is the exporter that replaced the dead
  # "amd_gpu" scrape job, which pointed at amd-metrics-exporter:9200 -- a
  # container that has never existed in this stack, so the target had been
  # permanently DOWN. This box's real GPU is the NVIDIA RTX 4060 Laptop GPU
  # (Jellyfin hardware transcoding, ComfyUI, Ollama); the AMD part is only the
  # CPU iGPU (Raphael), and node-exporter's hwmon collector already reports its
  # temperature/power via `node_hwmon_*`, so a dedicated AMD exporter would be
  # duplicated work.
  #
  # Uses NVIDIA's bundled default-counters.csv on purpose: do NOT mount a custom
  # one unless a field is missing. The bundled list is validated against the DCGM
  # version in this image, and a hand-written list fails closed -- one unknown
  # field name aborts the whole scrape with
  #   "failed to get counters: could not find DCGM field; unknown ExporterCounter field"
  # and the endpoint then returns zero metrics. (Cost me two attempts to learn:
  # DCGM_FI_DEV_GPU_CLOCK and DCGM_FI_DEV_POWER_LIMIT do not exist; the real
  # names are DCGM_FI_DEV_SM_CLOCK and DCGM_FI_DEV_POWER_MGMT_LIMIT.)
  dcgm-exporter:
    image: nvidia/dcgm-exporter:4.6.1-4.8.4
    container_name: dcgm-exporter
    # SYS_ADMIN is required: DCGM loads kernel modules to read GPU registers.
    # It is granted to this one container only, not to anything else in the stack.
    cap_add:
      - SYS_ADMIN
    gpus: all
    # No `ports:`. Prometheus scrapes it at dcgm-exporter:9400 over
    # monitoring_net; nothing else needs to reach it.
    # Deliberately NO --config-file: that flag expects a YAML config, so
    # pointing it at the bundled default-counters.csv makes the exporter parse
    # CSV as YAML and crash-loop with
    #   "parse config file ...: yaml: line 9: did not find expected <document start>"
    # With no flag it uses its own bundled counters file, which is what we want.
    networks:
      - monitoring_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    user: "1000:1000"
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Must be the public URL now that Traefik owns the front door; the old
      # value pointed at this host's LAN IP and leaked into redirects and emails.
      GF_SERVER_ROOT_URL: https://grafana.ghoulhub.uk/
      # Native OIDC against Authentik. The spec ranks OIDC above forward-auth, so
      # Grafana's own login is the gate and the Traefik router for this host
      # carries NO forward-auth middleware — gating twice would mean two
      # sessions and two redirects for what should be one login.
      #
      # This is safe without forward-auth only because the `ports:` mapping below
      # is gone: Grafana is unreachable except through Traefik, and Grafana
      # itself serves nothing until an OIDC login succeeds.
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      # Same secret Authentik's provider holds. Generated and kept in sync by
      # ../identity-stack/bootstrap.sh — there is one source of truth because the
      # two stacks cannot read each other's .env.
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_SECRET:?GRAFANA_OAUTH_SECRET missing — run ../identity-stack/bootstrap.sh}
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://sso.ghoulhub.uk/application/o/authorize/
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://sso.ghoulhub.uk/application/o/token/
      GF_AUTH_GENERIC_OAUTH_API_URL: https://sso.ghoulhub.uk/application/o/userinfo/
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      # PKCE on top of a confidential client: defence in depth, and it means a
      # leaked secret alone cannot complete an exchange.
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      # `sub` is the account key on Grafana's side, and the provider pins it to
      # user_uuid, so it cannot drift and spawn duplicate accounts.
      GF_AUTH_GENERIC_OAUTH_ID_TOKEN_ATTRIBUTE_PATH: sub
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_AUTO_SIGN_UP: "true"
      # ALLOWED_DOMAINS is deliberately left unset. Grafana matches it against
      # the domain of login_attribute_path, and the akadmin address is a
      # hotmail.com one — pinning it to ghoulhub.uk would lock the only user
      # out. The real gate is Authentik: no code is issued to anyone who cannot
      # authenticate there, so the domain allowlist buys nothing here.
      TZ: ${TZ}
    # No `ports:` — this is the point of the migration. Grafana used to publish
    # 0.0.0.0:3010, reachable on the LAN while completely bypassing Traefik and
    # Authentik. Traefik is the only way in now.
    #
    # Router labels live here rather than in proxy-stack so each app owns its own
    # routing. `security-headers` and `rate-limit` are referenced unqualified on
    # purpose: Traefik resolves a bare name against the router's own provider
    # namespace, so these must continue to exist as labels on the Traefik
    # container. There is deliberately NO `authentik-forwardauth` here — Grafana
    # does native OIDC, so its own login is the gate and adding forward-auth
    # would mean two logins and two sessions. For that reason this host also
    # needs NO companion /outpost.goauthentik.io router.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.ghoulhub.uk`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=le"
      - "traefik.http.routers.grafana.priority=10"
      - "traefik.http.routers.grafana.middlewares=security-headers,rate-limit"
    networks:
      - monitoring_net
      - proxy
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    privileged: true
    volumes:
      - ./homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    environment:
      TZ: ${TZ}
    # PRESERVED ON 0.0.0.0 ON PURPOSE — do not "tidy" this line.
    #
    # Home Assistant must be reachable from the LAN: the phone app talks to it
    # over the local network, and so do the IoT integrations (Matter, Zigbee
    # bridges, Chromecast, the voice assistants). Removing the published port
    # breaks the house.
    #
    # This is machine-to-machine traffic (rule 12), not human access, and HA is
    # NOT exposed to the internet: there is no tunnel ingress rule for it and
    # no Traefik router, so it is already private in the sense that matters.
    #
    # Do not put it behind forward-auth either. Verified, not assumed: HA's
    # frontend and its mobile app both authenticate with a bearer token and
    # send no cookie (/auth/authorize returns a code with no set-cookie;
    # /api/config returns 401 with no token, with a fake cookie, and with a
    # fake bearer alike). There is no SSO add-on installed and core 2026.9.3
    # ships none. A gate would lock you out of your own house.
    #
    # For access from outside the home, use Tailscale on the device — that
    # needs no public exposure and is already installed.
    ports:
      - "8123:8123"
    networks:
      - monitoring_net
    restart: unless-stopped

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable-tensorrt
    container_name: frigate
    privileged: true
    shm_size: '2gb'
    volumes:
      - ./frigate/config.yml:/config/config.yml:ro
      - /mnt/synology/frigate:/media/frigate
      - /etc/localtime:/etc/localtime:ro
    environment:
      FRIGATE_RTSP_PASSWORD: ${FRIGATE_RTSP_PASSWORD}
      TZ: ${TZ}
    # Split deliberately:
    #   5000    the Frigate web UI (camera wall, recordings, config). Was
    #           unauthenticated on 0.0.0.0 — it showed your live cameras to
    #           anyone on the Wi-Fi. Now loopback + tailnet. Frigate itself
    #           still reaches it fine: the Prometheus scrape target is
    #           frigate:5000 over monitoring_net, and the HA integration does
    #           the same.
    #   8554    go2rtc RTSP, 8555/udp WebRTC — PRESERVED ON 0.0.0.0. These are
    #           the stream *distribution* ports, and anything consuming a
    #           restream (a TV, an NVR, a recorder) needs to open them on the
    #           LAN. Cameras are pulled, not pushed, so this is for consumers.
    #           If you never stream Frigate outside this host, both can go too.
    ports:
      - "127.0.0.1:${FRIGATE_PORT:-5000}:5000"
      - "${TAILSCALE_IP:?TAILSCALE_IP unset - run ../bootstrap.sh}:${FRIGATE_PORT:-5000}:5000"
      - "8554:8554"
      - "8555:8555"
    networks:
      - monitoring_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
    restart: unless-stopped

networks:
  monitoring_net:
    driver: bridge
  # External so it is shared with proxy-stack and identity-stack rather than
  # duplicated per stack. Created by ../bootstrap.sh, not by compose — that way
  # the name is stable and survives a stack being stopped and recreated.
  proxy:
    external: true
