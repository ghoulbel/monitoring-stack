apiVersion: 1

# GENERATED by monitoring-stack/generate-alert-rules.py - do not hand-edit.
# Grafana 11 unified-alerting format. Rules cover the failure modes this
# migration actually hit: a silently full disk, a tunnel that drops while
# every app behind it stays healthy, and backups that stop without saying so.
groups:
  - name: host
    interval: 5m
    folder: Homelab
    rules:
      - alert: HostFilesystemCritical
        uid: host-filesystem-critical
        title: HostFilesystemCritical
        condition: C
        for: 10m
        isPaused: false
        annotations:
          summary: >-
            Filesystem {{ $labels.mountpoint }} is {{ $value | printf "%.1f" }}%
            full
          description: >-
            Less than 10% free on {{ $labels.device }}. This is what stopped the
            editor mid-migration. Check /var/lib/containerd first: docker system df
            shows reclaimable bytes.
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: >-
                100 -
                (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|fuse.*"} /
                node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|fuse.*"} *
                100) > 90
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: A
              refId: C
              type: threshold

      - alert: HostFilesystemWarning
        uid: host-filesystem-warning
        title: HostFilesystemWarning
        condition: C
        for: 30m
        isPaused: false
        annotations:
          summary: >-
            Filesystem {{ $labels.mountpoint }} is {{ $value | printf "%.1f" }}%
            full
          description: >-
            Free space is trending low; investigate before it becomes critical.
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: >-
                100 -
                (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|fuse.*"} /
                node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|fuse.*"} *
                100) > 80
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: A
              refId: C
              type: threshold

      - alert: HostFilesystemAlmostOutOfInodes
        uid: host-filesystem-almost-out-of-inodes
        title: HostFilesystemAlmostOutOfInodes
        condition: C
        for: 30m
        isPaused: false
        annotations:
          summary: >-
            Inodes nearly exhausted on {{ $labels.mountpoint }}
          description: >-
            Fewer than 10% of inodes free. Usually a huge number of small files.
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: >-
                100 -
                (node_filesystem_files_free{fstype!~"tmpfs|overlay|squashfs|fuse.*"} /
                node_filesystem_files{fstype!~"tmpfs|overlay|squashfs|fuse.*"} * 100) >
                10
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: A
              refId: C
              type: threshold

      - alert: HostOutOfMemory
        uid: host-out-of-memory
        title: HostOutOfMemory
        condition: C
        for: 10m
        isPaused: false
        annotations:
          summary: >-
            Less than 10% memory available
          description: >-
            Swap thrashing is likely. ollama and ComfyUI are the usual culprits
            here.
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: >-
                node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100 < 10
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: A
              refId: C
              type: threshold

  - name: backups
    interval: 15m
    folder: Homelab
    rules:
      - alert: KopiaSourceSnapshotStale
        uid: kopia-source-snapshot-stale
        title: KopiaSourceSnapshotStale
        condition: C
        for: 30m
        isPaused: false
        annotations:
          summary: >-
            Kopia source {{ $labels.source }} has not snapshotted in over 26 hours
          description: >-
            The daily schedule is 03:17, so a healthy host is never more than a day
            behind. A stale source means backups are not running. Check the kopia
            container and that /mnt/synology is still mounted.
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: >-
                kopia_snapshot_age_seconds{source=~"/source|/hostconfig"} > 93600
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: A
              refId: C
              type: threshold

      - alert: KopiaWeeklySourceSnapshotStale
        uid: kopia-weekly-source-snapshot-stale
        title: KopiaWeeklySourceSnapshotStale
        condition: C
        for: 1h
        isPaused: false
        annotations:
          summary: >-
            Kopia arr-stack/config has not snapshotted in over 8 days
          description: >-
            This source runs weekly (Sunday 04:41), so 8 days means it missed a run.
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: >-
                kopia_snapshot_age_seconds{source="/source/arr-stack/config"} > 691200
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: A
              refId: C
              type: threshold

      - alert: KopiaMetricsMissing
        uid: kopia-metrics-missing
        title: KopiaMetricsMissing
        condition: C
        for: 2h
        isPaused: false
        annotations:
          summary: >-
            Kopia freshness metrics are missing
          description: >-
            kopia-metrics.timer may have failed, so backup staleness cannot be
            detected.
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: >-
                absent(kopia_snapshot_age_seconds)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: A
              refId: C
              type: threshold

  - name: services
    interval: 1m
    folder: Homelab
    rules:
      - alert: CloudflaredTunnelDown
        uid: cloudflared-tunnel-down
        title: CloudflaredTunnelDown
        condition: C
        for: 5m
        isPaused: false
        annotations:
          summary: >-
            The Cloudflare tunnel connector is not running
          description: >-
            All nine public hostnames will return Cloudflare 1033. Check: systemctl
            status cloudflared
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: >-
                cloudflared_active == 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: A
              refId: C
              type: threshold

      - alert: CloudflaredNoRegisteredConnections
        uid: cloudflared-no-registered-connections
        title: CloudflaredNoRegisteredConnections
        condition: C
        for: 10m
        isPaused: false
        annotations:
          summary: >-
            cloudflared is running but has no registered tunnel connection
          description: >-
            The process is up but is not connected to any Cloudflare edge. This is
            the exact state that produced error 1033, and it is different from the
            process being down.
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: >-
                cloudflared_connections < 1
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: A
              refId: C
              type: threshold

      - alert: PrometheusTargetDown
        uid: prometheus-target-down
        title: PrometheusTargetDown
        condition: C
        for: 15m
        isPaused: false
        annotations:
          summary: >-
            Prometheus target {{ $labels.job }} is down
          description: >-
            Instance {{ $labels.instance }} has been unreachable for 15 minutes.
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: >-
                up == 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: A
              refId: C
              type: threshold

      - alert: GrafanaDown
        uid: grafana-down
        title: GrafanaDown
        condition: C
        for: 10m
        isPaused: false
        annotations:
          summary: >-
            Grafana is not responding
          description: >-
            This is how the rest of the estate is observed, so treat it as high
            priority.
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: >-
                up{job="grafana"} == 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: A
              refId: C
              type: threshold

  - name: storage
    interval: 10m
    folder: Homelab
    rules:
      - alert: SynologyMountMissing
        uid: synology-mount-missing
        title: SynologyMountMissing
        condition: C
        for: 10m
        isPaused: false
        annotations:
          summary: >-
            /mnt/synology is not mounted
          description: >-
            The NAS holds the Kopia repository and all media. Without it the backup-
            stack has nowhere to write and every arr path is empty.
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: >-
                absent(node_filesystem_avail_bytes{mountpoint="/mnt/synology"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: A
              refId: C
              type: threshold
